name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest -q
  install-and-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install .
      - name: Demo repo reports its stale references (exit 1 expected)
        run: |
          set +e
          stalemd --root examples/demo-repo
          test $? -eq 1
      - name: This repo's own AGENTS.md is clean
        run: stalemd AGENTS.md
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the action on the demo repo without failing
        uses: ./
        with:
          files: examples/demo-repo/AGENTS.md
          fail: "false"
