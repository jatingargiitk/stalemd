[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stalemd"
version = "0.1.0"
description = "Find the commands, scripts and paths in AGENTS.md / CLAUDE.md that no longer exist in your repo."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Jatin Garg"}]
requires-python = ">=3.9"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
stalemd = "stalemd.cli:main"

[project.urls]
Homepage = "https://github.com/jatingargiitk/stalemd"

[tool.setuptools.packages.find]
where = ["src"]
